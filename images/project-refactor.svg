<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <rect width="400" height="240" rx="16" fill="url(#bg-ref)" />
  <defs>
    <linearGradient id="bg-ref" x1="0" y1="0" x2="400" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8DCC8" stop-opacity="0.9" />
      <stop offset="1" stop-color="#D8EDF0" stop-opacity="0.85" />
    </linearGradient>
    <filter id="shadow-ref" x="-6" y="-3" width="170" height="180" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#30394B" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Left Card: Before (Messy) -->
  <g filter="url(#shadow-ref)" transform="translate(35, 40)">
    <rect width="145" height="160" rx="10" fill="#FFFDF7" stroke="#E8B4B8" stroke-width="1.5" />
    <rect x="12" y="14" width="55" height="16" rx="4" fill="#E8B4B8" fill-opacity="0.3" />
    <text x="18" y="26" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#B24C53">BEFORE</text>
    <!-- Tangled, unindented lines -->
    <path d="M 14 45 Q 60 55 130 40" stroke="#30394B" stroke-width="2" opacity="0.4" fill="none" />
    <path d="M 14 62 Q 80 40 125 70" stroke="#B24C53" stroke-width="2" opacity="0.6" fill="none" />
    <path d="M 14 80 L 130 80" stroke="#30394B" stroke-width="2" opacity="0.3" stroke-dasharray="2 3" />
    <path d="M 14 96 Q 50 115 128 92" stroke="#30394B" stroke-width="2" opacity="0.5" fill="none" />
    <path d="M 14 114 L 105 114" stroke="#B24C53" stroke-width="2" opacity="0.6" />
    <path d="M 14 130 Q 70 145 130 135" stroke="#30394B" stroke-width="2" opacity="0.4" fill="none" />
    <circle cx="120" cy="142" r="5" fill="#E8B4B8" />
    <text x="118" y="145" font-family="sans-serif" font-size="8" fill="#B24C53">!</text>
  </g>

  <!-- Transform Arrow in middle with AI Sparkle -->
  <g transform="translate(192, 105)">
    <circle cx="10" cy="15" r="16" fill="#356C80" />
    <path d="M 5 15 L 14 15 M 11 11 L 15 15 L 11 19" stroke="#FFFDF7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="-4" y="-8" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#356C80">AI Clean</text>
  </g>

  <!-- Right Card: After (Refactored Clean) -->
  <g filter="url(#shadow-ref)" transform="translate(225, 40)">
    <rect width="145" height="160" rx="10" fill="#FFFDF7" stroke="#A8D5BA" stroke-width="1.5" />
    <rect x="12" y="14" width="48" height="16" rx="4" fill="#A8D5BA" fill-opacity="0.35" />
    <text x="18" y="26" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#2E7D52">AFTER</text>
    <!-- Neat modular blocks -->
    <rect x="14" y="42" width="65" height="6" rx="3" fill="#356C80" />
    <rect x="24" y="56" width="95" height="5" rx="2.5" fill="#B9C8F0" />
    <rect x="24" y="68" width="80" height="5" rx="2.5" fill="#30394B" fill-opacity="0.6" />
    <rect x="14" y="86" width="70" height="6" rx="3" fill="#356C80" />
    <rect x="24" y="100" width="105" height="5" rx="2.5" fill="#B9C8F0" />
    <rect x="24" y="112" width="90" height="5" rx="2.5" fill="#A8D5BA" />
    <rect x="14" y="130" width="118" height="18" rx="4" fill="#D8EDF0" fill-opacity="0.6" />
    <text x="24" y="142" font-family="monospace" font-size="8" fill="#356C80">PEP 8 ✓ Modular</text>
  </g>
</svg>
