<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <rect width="400" height="240" rx="16" fill="url(#bg-qz)" />
  <defs>
    <linearGradient id="bg-qz" x1="0" y1="0" x2="400" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B9C8F0" />
      <stop offset="1" stop-color="#D8EDF0" />
    </linearGradient>
    <filter id="shadow-qz" x="-6" y="-3" width="310" height="190" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#30394B" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Quiz Card Modal -->
  <g filter="url(#shadow-qz)" transform="translate(55, 30)">
    <rect width="290" height="180" rx="14" fill="#FFFDF7" stroke="#356C80" stroke-width="1.2" stroke-opacity="0.2" />
    <!-- Header -->
    <text x="24" y="32" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#356C80">Interactive Tech &amp; GK Quiz</text>
    <rect x="220" y="20" width="46" height="18" rx="9" fill="#D8EDF0" />
    <text x="231" y="33" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#356C80">4 / 10</text>
    <!-- Question -->
    <text x="24" y="58" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#30394B">What does “HTTP” stand for?</text>
    <!-- Option A -->
    <g transform="translate(24, 72)">
      <rect width="242" height="26" rx="6" fill="#FFFDF7" stroke="#E8DCC8" stroke-width="1.2" />
      <circle cx="14" cy="13" r="5" fill="#E8DCC8" />
      <text x="28" y="16" font-family="system-ui, sans-serif" font-size="9" fill="#30394B">Hyperlink Text Terminal Protocol</text>
    </g>
    <!-- Option B (Correct) -->
    <g transform="translate(24, 104)">
      <rect width="242" height="26" rx="6" fill="#EBF6F0" stroke="#A8D5BA" stroke-width="1.5" />
      <circle cx="14" cy="13" r="6" fill="#2E7D52" />
      <path d="M 11 13 L 13 15 L 17 11" stroke="#FFFDF7" stroke-width="1.5" stroke-linecap="round" />
      <text x="28" y="16" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#2E7D52">Hyper Text Transfer Protocol ✓</text>
    </g>
    <!-- Option C -->
    <g transform="translate(24, 136)">
      <rect width="242" height="26" rx="6" fill="#FFFDF7" stroke="#E8DCC8" stroke-width="1.2" />
      <circle cx="14" cy="13" r="5" fill="#E8DCC8" />
      <text x="28" y="16" font-family="system-ui, sans-serif" font-size="9" fill="#30394B">High Traffic Transfer Protocol</text>
    </g>
  </g>
</svg>
