<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <rect width="400" height="240" rx="16" fill="url(#bg-py)" />
  <!-- subtle grid pattern -->
  <defs>
    <linearGradient id="bg-py" x1="0" y1="0" x2="400" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D8EDF0" stop-opacity="0.9" />
      <stop offset="1" stop-color="#B9C8F0" stop-opacity="0.8" />
    </linearGradient>
    <filter id="shadow" x="-8" y="-4" width="220" height="180" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#30394B" flood-opacity="0.12" />
    </filter>
  </defs>
  <!-- Background circular ripple -->
  <circle cx="330" cy="70" r="80" fill="#FFFDF7" fill-opacity="0.4" />
  <circle cx="330" cy="70" r="50" fill="#FFFDF7" fill-opacity="0.6" />
  
  <!-- Code Card Window -->
  <g filter="url(#shadow)">
    <rect x="40" y="35" width="210" height="170" rx="12" fill="#FFFDF7" />
    <circle cx="58" cy="53" r="4.5" fill="#E8B4B8" />
    <circle cx="72" cy="53" r="4.5" fill="#F9D976" />
    <circle cx="86" cy="53" r="4.5" fill="#A8D5BA" />
    <line x1="40" y1="67" x2="250" y2="67" stroke="#E8DCC8" stroke-width="1" />
    <!-- Code lines -->
    <rect x="55" y="80" width="80" height="7" rx="3" fill="#356C80" />
    <rect x="68" y="96" width="110" height="6" rx="3" fill="#B9C8F0" />
    <rect x="80" y="110" width="130" height="6" rx="3" fill="#30394B" fill-opacity="0.5" />
    <rect x="80" y="124" width="95" height="6" rx="3" fill="#E8DCC8" />
    <rect x="68" y="138" width="120" height="6" rx="3" fill="#356C80" fill-opacity="0.7" />
    <rect x="55" y="152" width="70" height="6" rx="3" fill="#30394B" fill-opacity="0.4" />
    <rect x="55" y="168" width="140" height="18" rx="4" fill="#D8EDF0" fill-opacity="0.6" />
    <rect x="65" y="174" width="75" height="6" rx="3" fill="#356C80" />
  </g>

  <!-- Fibonacci Spiral / Mathematical Graphic -->
  <g transform="translate(255, 65)">
    <rect width="105" height="135" rx="12" fill="#30394B" fill-opacity="0.9" />
    <text x="14" y="28" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#D8EDF0">Algorithms</text>
    <path d="M 20 115 A 15 15 0 0 1 35 100 A 25 25 0 0 1 60 75 A 40 40 0 0 1 100 35" fill="none" stroke="#F9D976" stroke-width="2.5" stroke-dasharray="3 3" />
    <circle cx="20" cy="115" r="4" fill="#B9C8F0" />
    <circle cx="35" cy="100" r="4" fill="#B9C8F0" />
    <circle cx="60" cy="75" r="4" fill="#B9C8F0" />
    <circle cx="95" cy="40" r="4" fill="#F9D976" />
    <text x="14" y="122" font-family="system-ui, sans-serif" font-size="9" fill="#FFFDF7" opacity="0.8">fib(n) | n!</text>
  </g>
</svg>
