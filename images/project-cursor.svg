<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <rect width="400" height="240" rx="16" fill="url(#bg-cur)" />
  <defs>
    <linearGradient id="bg-cur" x1="0" y1="0" x2="400" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#30394B" />
      <stop offset="1" stop-color="#356C80" />
    </linearGradient>
    <filter id="shadow-cur" x="-6" y="-3" width="340" height="190" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- IDE Window Frame -->
  <g filter="url(#shadow-cur)" transform="translate(45, 30)">
    <rect width="310" height="180" rx="12" fill="#1E2533" stroke="#B9C8F0" stroke-width="1.2" stroke-opacity="0.3" />
    <rect width="310" height="30" rx="12" fill="#161B26" />
    <rect y="18" width="310" height="12" fill="#161B26" />
    <!-- Window buttons -->
    <circle cx="20" cy="15" r="4.5" fill="#E8B4B8" />
    <circle cx="34" cy="15" r="4.5" fill="#F9D976" />
    <circle cx="48" cy="15" r="4.5" fill="#A8D5BA" />
    <text x="105" y="19" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#B9C8F0" opacity="0.9">Cursor AI · Debug Session</text>

    <!-- Code Line Numbers & Code -->
    <text x="16" y="55" font-family="monospace" font-size="9" fill="#5F708A">1</text>
    <text x="16" y="73" font-family="monospace" font-size="9" fill="#5F708A">2</text>
    <text x="16" y="91" font-family="monospace" font-size="9" fill="#5F708A">3</text>
    <text x="16" y="109" font-family="monospace" font-size="9" fill="#5F708A">4</text>
    <text x="16" y="127" font-family="monospace" font-size="9" fill="#5F708A">5</text>
    <text x="16" y="145" font-family="monospace" font-size="9" fill="#5F708A">6</text>

    <!-- Code rows -->
    <rect x="36" y="47" width="120" height="7" rx="3" fill="#D8EDF0" opacity="0.8" />
    <rect x="52" y="65" width="85" height="7" rx="3" fill="#B9C8F0" opacity="0.8" />
    
    <!-- Bug Highlight line -->
    <rect x="30" y="81" width="265" height="18" rx="4" fill="#E8B4B8" fill-opacity="0.18" stroke="#E8B4B8" stroke-width="1" stroke-dasharray="3 3" />
    <rect x="52" y="86" width="130" height="7" rx="3" fill="#E8B4B8" />
    <text x="195" y="93" font-family="system-ui, sans-serif" font-size="8" fill="#E8B4B8" font-weight="600">⚠ IndexError</text>

    <!-- Cursor AI Suggestion Chip -->
    <g transform="translate(42, 115)">
      <rect width="245" height="48" rx="8" fill="#253246" stroke="#F9D976" stroke-width="1.2" />
      <circle cx="16" cy="16" r="6" fill="#F9D976" fill-opacity="0.2" />
      <path d="M 13 16 L 15 18 L 19 14" stroke="#F9D976" stroke-width="1.5" stroke-linecap="round" />
      <text x="28" y="19" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#F9D976">Cursor Fix Proposed</text>
      <text x="16" y="36" font-family="monospace" font-size="8.5" fill="#A8D5BA">+ if idx &lt; len(arr): return arr[idx]</text>
    </g>
  </g>
</svg>
